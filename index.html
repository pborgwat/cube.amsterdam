<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cube.amsterdam is for sale</title>
  <meta name="description" content="The domain cube.amsterdam is for sale. Leave your details and we will get in touch.">
  <meta property="og:title" content="cube.amsterdam is for sale">
  <meta property="og:description" content="A building, a shop, a museum, an icon. The domain cube.amsterdam is available.">
  <meta property="og:image" content="https://cube.amsterdam/img/cube-dam.jpg">
  <meta property="og:url" content="https://cube.amsterdam/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' fill='%23ffd400'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="img/cube-dam.jpg">
  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
      --accent: #ffd400;
      --muted: rgba(255, 255, 255, 0.72);
      --field: rgba(255, 255, 255, 0.94);
      --line: rgba(255, 255, 255, 0.28);
      --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- slideshow ---------- */
    .slides {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1.8s ease, transform 9s linear;
      will-change: opacity, transform;
    }

    .slide.is-active {
      opacity: 1;
      transform: scale(1);
    }

    .slides::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0) 55%);
    }

    .slides::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0) 75%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .form-open .slides::before { opacity: 1; }

    /* ---------- content ---------- */
    main {
      position: fixed;
      z-index: 1;
      left: 0;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      padding: 0 16px 56px 40px;
    }

    h1 {
      margin: 0 0 16px;
      font-weight: 800;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1.02;
      letter-spacing: -0.03em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3), 0 2px 24px rgba(0,0,0,0.35);
    }

    h1 .sale { color: var(--accent); }

    .reveal {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s ease, opacity 0.35s ease;
      opacity: 0;
    }

    .reveal > div { overflow: hidden; }

    .open .reveal {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding-bottom: 6px;
    }

    .full { grid-column: 1 / -1; }

    label {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    input, textarea {
      width: 100%;
      border: 0;
      border-radius: 0;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      padding: 10px 12px;
      outline: none;
      transition: box-shadow 0.2s ease, background 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    input::placeholder, textarea::placeholder { color: #6b6b6b; }

    input:focus, textarea:focus {
      background: #ffffff;
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .cta {
      display: inline-block;
      border: 0;
      border-radius: 0;
      background: var(--accent);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.01em;
      padding: 11px 20px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .cta:hover { filter: brightness(1.06); }
    .cta:active { transform: translateY(1px); }
    .cta:disabled { opacity: 0.6; cursor: progress; }
    .cta:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

    form .cta { grid-column: 1 / -1; width: 100%; }
    .open #open { display: none; }

    .hp { display: none !important; }

    .status {
      grid-column: 1 / -1;
      margin: 2px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .status:empty { display: none; }
    .status.err { color: #ffb4a8; }

    .thanks {
      display: none;
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
      text-shadow: 0 1px 12px rgba(0,0,0,0.5);
    }

    .thanks strong { color: var(--accent); }

    /* ---------- dots ---------- */
    .dots {
      position: fixed;
      z-index: 2;
      right: 40px;
      bottom: 60px;
      display: flex;
      gap: 6px;
    }

    .dots button {
      width: 22px;
      height: 3px;
      padding: 0;
      border: 0;
      background: var(--line);
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .dots button[aria-current="true"] { background: var(--paper); }

    @media (max-width: 600px) {
      .slides::after {
        background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.5) 35%, rgba(0,0,0,0) 65%);
      }
      main { padding: 0 16px 48px; max-width: none; }
      .dots { right: auto; left: 16px; bottom: 22px; }
    }

    @media (max-width: 380px) {
      form { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide { transform: none !important; transition: opacity 1.2s ease; }
    }
  </style>
</head>
<body>
  <div class="slides" aria-hidden="true">
    <div class="slide is-active" style="background-image:url('img/cube-dam.jpg')"></div>
    <div class="slide" data-src="img/cube-museumplein.jpg"></div>
    <div class="slide" data-src="img/cube-gracht.jpg"></div>
    <div class="slide" data-src="img/cube-gebouw.jpg"></div>
    <div class="slide" data-src="img/cube-winkel.jpg"></div>
    <div class="slide" data-src="img/cube-museum.jpg"></div>
  </div>

  <main id="panel">
    <h1>cube.amsterdam<br>is <span class="sale">for sale</span></h1>

    <button class="cta" id="open" type="button" aria-expanded="false" aria-controls="reveal">I'm interested</button>

    <div class="reveal" id="reveal">
      <div>
        <form id="interest" novalidate>
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required tabindex="-1">
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required tabindex="-1">
          </div>
          <div class="full">
            <label for="company">Company (optional)</label>
            <input id="company" name="company" type="text" placeholder="Company (optional)" autocomplete="organization" tabindex="-1">
          </div>
          <div class="full">
            <label for="message">Message or offer</label>
            <textarea id="message" name="message" placeholder="Your message or offer (optional)" tabindex="-1"></textarea>
          </div>
          <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">
          <button class="cta" type="submit" tabindex="-1">Send</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <p class="thanks" id="thanks" role="status" aria-live="polite">
      <strong>Thank you.</strong> We received your interest and will get back to you soon.
    </p>
  </main>

  <nav class="dots" id="dots" aria-label="Slides"></nav>

  <script>
    (function () {
      /* ---------- slideshow ---------- */
      var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
      var dots = document.getElementById('dots');
      var current = 0;
      var timer;
      var INTERVAL = 6500;

      function load(slide) {
        var src = slide.getAttribute('data-src');
        if (src) {
          slide.style.backgroundImage = "url('" + src + "')";
          slide.removeAttribute('data-src');
        }
      }

      slides.forEach(function (_, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Image ' + (i + 1));
        b.addEventListener('click', function () { go(i); restart(); });
        dots.appendChild(b);
      });

      function go(i) {
        slides[current].classList.remove('is-active');
        current = (i + slides.length) % slides.length;
        load(slides[current]);
        load(slides[(current + 1) % slides.length]);
        slides[current].classList.add('is-active');
        Array.prototype.forEach.call(dots.children, function (d, j) {
          d.setAttribute('aria-current', j === current ? 'true' : 'false');
        });
      }

      function restart() {
        clearInterval(timer);
        timer = setInterval(function () { go(current + 1); }, INTERVAL);
      }

      load(slides[1]);
      go(0);
      restart();

      /* ---------- form ---------- */
      // FormSubmit endpoint. Replace KEY with the alias FormSubmit provides after activation.
      var KEY = atob('cGVwaWpuQHN5bmVyZ2lxdWUubmw=');
      var ENDPOINT = 'https://formsubmit.co/ajax/' + KEY;

      var panel = document.getElementById('panel');
      var openBtn = document.getElementById('open');
      var form = document.getElementById('interest');
      openBtn.addEventListener('click', function () {
        panel.classList.add('open');
        document.body.classList.add('form-open');
        openBtn.setAttribute('aria-expanded', 'true');
        Array.prototype.forEach.call(form.querySelectorAll('input:not(.hp), textarea, button'), function (el) {
          el.removeAttribute('tabindex');
        });
        setTimeout(function () { form.elements['name'].focus(); }, 250);
      });

      var status = document.getElementById('status');
      var thanks = document.getElementById('thanks');
      var btn = form.querySelector('button[type=submit]');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        status.className = 'status';

        var name = form.elements['name'].value.trim();
        var email = form.elements['email'].value.trim();
        if (!name || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          status.textContent = 'Please fill in your name and a valid email address.';
          status.classList.add('err');
          return;
        }
        if (form.elements['_honey'].value) return;

        btn.disabled = true;
        status.textContent = 'Sending...';

        fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: name,
            email: email,
            company: form.elements['company'].value.trim(),
            message: form.elements['message'].value.trim(),
            _subject: 'Interest in cube.amsterdam',
            _replyto: email,
            _template: 'table'
          })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || String(res.d.success) !== 'true') throw new Error('send');
            document.getElementById('reveal').style.display = 'none';
            thanks.style.display = 'block';
          })
          .catch(function () {
            btn.disabled = false;
            status.textContent = 'Something went wrong. Please try again in a moment.';
            status.classList.add('err');
          });
      });
    })();
  </script>
</body>
</html>
