<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cube.amsterdam is for sale</title>
  <meta name="description" content="The domain cube.amsterdam is for sale. Leave your details and we will get in touch.">
  <meta property="og:title" content="cube.amsterdam is for sale">
  <meta property="og:description" content="A building, a shop, a museum, an icon. The domain cube.amsterdam is available.">
  <meta property="og:image" content="https://cube.amsterdam/img/cube-dam.jpg">
  <meta property="og:url" content="https://cube.amsterdam/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' fill='%23ffd400'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="img/cube-dam.jpg">
  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
      --accent: #ffd400;
      --muted: rgba(255, 255, 255, 0.72);
      --field: rgba(255, 255, 255, 0.94);
      --line: rgba(255, 255, 255, 0.28);
      --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- slideshow ---------- */
    .slides {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1.8s ease, transform 9s linear;
      will-change: opacity, transform;
    }

    .slide.is-active {
      opacity: 1;
      transform: scale(1);
    }

    .slides::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.18) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.05), rgba(0,0,0,0.35));
    }

    /* ---------- content ---------- */
    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 72px;
    }

    h1 {
      margin: 0 0 36px;
      font-weight: 800;
      font-size: clamp(2.4rem, 8.5vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25), 0 4px 40px rgba(0,0,0,0.45);
    }

    h1 .domain { display: block; }
    h1 .sale { color: var(--accent); }

    form {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full { grid-column: 1 / -1; }

    label {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    input, textarea {
      width: 100%;
      border: 0;
      border-radius: 0;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: box-shadow 0.2s ease, background 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 96px;
    }

    input::placeholder, textarea::placeholder { color: #6b6b6b; }

    input:focus, textarea:focus {
      background: #ffffff;
      box-shadow: 0 0 0 3px var(--accent);
    }

    button {
      grid-column: 1 / -1;
      border: 0;
      border-radius: 0;
      background: var(--accent);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.02em;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    button:hover { filter: brightness(1.06); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: progress; }
    button:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

    .hp { display: none !important; }

    .status {
      grid-column: 1 / -1;
      min-height: 1.4em;
      margin: 4px 0 0;
      font-size: 15px;
      color: var(--muted);
      text-align: center;
    }

    .status.ok { color: var(--paper); }
    .status.err { color: #ffb4a8; }

    .thanks {
      display: none;
      max-width: 520px;
      text-align: center;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .thanks strong { color: var(--accent); }

    /* ---------- dots ---------- */
    .dots {
      position: fixed;
      z-index: 2;
      left: 0; right: 0;
      bottom: 22px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dots button {
      grid-column: auto;
      width: 28px;
      height: 3px;
      padding: 0;
      background: var(--line);
      transition: background 0.3s ease;
    }

    .dots button[aria-current="true"] { background: var(--paper); }

    @media (max-width: 520px) {
      form { grid-template-columns: 1fr; }
      h1 { margin-bottom: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide { transform: none !important; transition: opacity 1.2s ease; }
    }
  </style>
</head>
<body>
  <div class="slides" aria-hidden="true">
    <div class="slide is-active" style="background-image:url('img/cube-dam.jpg')"></div>
    <div class="slide" data-src="img/cube-museumplein.jpg"></div>
    <div class="slide" data-src="img/cube-gracht.jpg"></div>
    <div class="slide" data-src="img/cube-gebouw.jpg"></div>
    <div class="slide" data-src="img/cube-winkel.jpg"></div>
    <div class="slide" data-src="img/cube-museum.jpg"></div>
  </div>

  <main>
    <h1><span class="domain">cube.amsterdam</span> is <span class="sale">for sale</span></h1>

    <form id="interest" novalidate>
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
      </div>
      <div class="full">
        <label for="company">Company (optional)</label>
        <input id="company" name="company" type="text" placeholder="Company (optional)" autocomplete="organization">
      </div>
      <div class="full">
        <label for="message">Message or offer</label>
        <textarea id="message" name="message" placeholder="Your message or offer (optional)"></textarea>
      </div>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">
      <button type="submit">I'm interested</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="thanks" id="thanks" role="status" aria-live="polite">
      <strong>Thank you.</strong><br>
      We received your interest in cube.amsterdam and will get back to you soon.
    </p>
  </main>

  <nav class="dots" id="dots" aria-label="Slides"></nav>

  <script>
    (function () {
      /* ---------- slideshow ---------- */
      var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
      var dots = document.getElementById('dots');
      var current = 0;
      var timer;
      var INTERVAL = 6500;

      function load(slide) {
        var src = slide.getAttribute('data-src');
        if (src) {
          slide.style.backgroundImage = "url('" + src + "')";
          slide.removeAttribute('data-src');
        }
      }

      slides.forEach(function (_, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Image ' + (i + 1));
        b.addEventListener('click', function () { go(i); restart(); });
        dots.appendChild(b);
      });

      function go(i) {
        slides[current].classList.remove('is-active');
        current = (i + slides.length) % slides.length;
        load(slides[current]);
        load(slides[(current + 1) % slides.length]);
        slides[current].classList.add('is-active');
        Array.prototype.forEach.call(dots.children, function (d, j) {
          d.setAttribute('aria-current', j === current ? 'true' : 'false');
        });
      }

      function restart() {
        clearInterval(timer);
        timer = setInterval(function () { go(current + 1); }, INTERVAL);
      }

      load(slides[1]);
      go(0);
      restart();

      /* ---------- form ---------- */
      // FormSubmit endpoint. Replace KEY with the alias FormSubmit provides after activation.
      var KEY = atob('Y3ViZUBzeW5lcmdpcXVlLm5s');
      var ENDPOINT = 'https://formsubmit.co/ajax/' + KEY;

      var form = document.getElementById('interest');
      var status = document.getElementById('status');
      var thanks = document.getElementById('thanks');
      var btn = form.querySelector('button[type=submit]');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        status.className = 'status';

        var name = form.name.value.trim();
        var email = form.email.value.trim();
        if (!name || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          status.textContent = 'Please fill in your name and a valid email address.';
          status.classList.add('err');
          return;
        }
        if (form._honey.value) return;

        btn.disabled = true;
        status.textContent = 'Sending...';

        fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: name,
            email: email,
            company: form.company.value.trim(),
            message: form.message.value.trim(),
            _subject: 'Interest in cube.amsterdam',
            _replyto: email,
            _template: 'table'
          })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || String(res.d.success) !== 'true') throw new Error('send');
            form.style.display = 'none';
            thanks.style.display = 'block';
          })
          .catch(function () {
            btn.disabled = false;
            status.textContent = 'Something went wrong. Please try again in a moment.';
            status.classList.add('err');
          });
      });
    })();
  </script>
</body>
</html>
